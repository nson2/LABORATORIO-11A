<div class="container mt-4">

  <h2>Catalogo de productos</h2>

  <p>Total de productos: {{ totalElementos }}</p>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Estado</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of productos">
        <td>{{ p.id }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.precio | currency:'PEN':'symbol':'1.2-2' }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.estadoStock }}</td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center">

    <button class="btn btn-outline-primary"
            (click)="anterior()"
            [disabled]="primera">
      Anterior
    </button>

    <span>
      Pagina {{ pagina + 1 }} de {{ totalPaginas }}
    </span>

    <button class="btn btn-outline-primary"
            (click)="siguiente()"
            [disabled]="ultima">
      Siguiente
    </button>

  </div>
</div>
